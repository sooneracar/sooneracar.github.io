<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soner Acar | Tessyn Labs Co. — Mobile Product & Game Studio</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --green: #10b981;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 0 20px;
    }
    .container { max-width: 980px; margin: 0 auto; }
    header {
      padding: 80px 0 60px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.12);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.6rem;
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 720px;
      margin-bottom: 32px;
    }
    .btn-group { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--muted); }

    section { padding: 60px 0; border-bottom: 1px solid var(--border); }
    h2 { font-size: 1.6rem; margin-bottom: 8px; }
    .section-desc { color: var(--muted); margin-bottom: 32px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .card-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
    }
    .status-pill {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
    }
    .status-dev {
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber);
    }
    .card h3 { font-size: 1.25rem; margin-bottom: 10px; }
    .card p { color: var(--muted); font-size: 0.94rem; margin-bottom: 18px; }
    .tech-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .tech {
      background: #1f2937;
      color: #d1d5db;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .service-price {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--green);
      font-weight: 600;
    }
    footer {
      padding: 40px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      header { padding: 50px 0 40px; }
    }
  </style>
</head>
